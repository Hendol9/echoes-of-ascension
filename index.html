<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Echoes of Ascension</title>
    <style>
        body { margin:0; background:#0a0a1f; font-family:Arial; overflow:hidden; touch-action: manipulation; }
        canvas { display:block; margin:0 auto; background:#0a0a1f; }
        #controls { position:fixed; bottom:20px; left:20px; display:none; }
        #jumpBtn { width:80px; height:80px; background:rgba(255,255,255,0.2); border-radius:50%; color:white; font-size:18px; display:flex; align-items:center; justify-content:center; border:3px solid rgba(255,255,255,0.4); }
        @media (max-width: 900px) { #controls { display:flex; } }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="controls">
        <div id="jumpBtn">↑ JUMP</div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let w, h;

        function resize() {
            w = canvas.width = Math.min(800, window.innerWidth - 20);
            h = canvas.height = Math.min(500, window.innerHeight - 100);
        }
        resize();
        window.addEventListener('resize', resize);

        // Game variables
        let x = 100, y = 300, vy = 0, grounded = false;
        let scroll = 0, distance = 0;
        let score = 0;
        let gameOver = false, won = false;

        const gravity = 0.8, jumpPower = -18;
        let keys = {}, touches = [];

        // Simple platforms / obstacles
        let obstacles = [];
        let orbs = [];

        function generateStuff() {
            if (Math.random() < 0.03) {
                obstacles.push({x: scroll + w + 50, y: 250 + Math.random()*150, w:40, h:40});
            }
            if (Math.random() < 0.04) {
                orbs.push({x: scroll + w + 100, y: 100 + Math.random()*300, collected: false});
            }
        }

        // Controls
        document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        const jumpBtn = document.getElementById('jumpBtn');
        jumpBtn.addEventListener('touchstart', e => { e.preventDefault(); jump(); });
        jumpBtn.addEventListener('mousedown', () => jump());

        function jump() {
            if (grounded) {
                vy = jumpPower;
                grounded = false;
            }
        }

        function update() {
            if (gameOver || won) return;

            scroll += 3;           // Constant forward movement
            distance += 3;

            // Gravity
            vy += gravity;
            y += vy;

            // Ground
            if (y >= 350) {
                y = 350;
                vy = 0;
                grounded = true;
            }

            generateStuff();

            // Collision with obstacles
            for (let obs of obstacles) {
                if (x + 30 > obs.x - scroll && x < obs.x - scroll + obs.w &&
                    y + 40 > obs.y && y < obs.y + obs.h) {
                    gameOver = true;
                }
            }

            // Collect orbs
            for (let orb of orbs) {
                if (!orb.collected && Math.hypot(x + 20 - (orb.x - scroll), y + 20 - orb.y) < 35) {
                    orb.collected = true;
                    score++;
                }
            }

            // Win condition (after \~4 minutes worth of distance)
            if (distance > 7200) won = true;
        }

        function draw() {
            ctx.fillStyle = '#0a0a1f';
            ctx.fillRect(0, 0, w, h);

            // Background layers (parallax)
            ctx.fillStyle = '#1a2a1a';
            ctx.fillRect(0, 0, w, h);

            // Ground
            ctx.fillStyle = '#223322';
            ctx.fillRect(0, 380, w, h-380);

            // Biomes tint
            let progress = distance / 7200;
            if (progress > 0.25) ctx.fillStyle = 'rgba(40,20,60,0.4)'; // Crystal
            ctx.fillRect(0, 0, w, h);

            // Player (stylized)
            ctx.fillStyle = '#88ffcc';
            ctx.fillRect(x, y, 40, 50);           // body
            ctx.fillStyle = '#ffeeaa';
            ctx.fillRect(x+10, y-10, 20, 20);     // head

            // Obstacles
            ctx.fillStyle = '#ff4444';
            for (let obs of obstacles) {
                ctx.fillRect(obs.x - scroll, obs.y, obs.w, obs.h);
            }

            // Orbs
            ctx.fillStyle = '#ffff88';
            for (let orb of orbs) {
                if (!orb.collected) {
                    ctx.beginPath();
                    ctx.arc(orb.x - scroll, orb.y, 18, 0, Math.PI*2);
                    ctx.fill();
                }
            }

            // UI
            ctx.fillStyle = 'white';
            ctx.font = '20px Arial';
            ctx.fillText(`Memories: ${score}/12`, 20, 50);
            ctx.fillText(`Ascension: ${Math.floor(Math.min(100, distance/72))}%`, 20, 80);

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0,0,w,h);
                ctx.fillStyle = '#ff6666';
                ctx.font = '40px Arial';
                ctx.fillText('You faded...', w/2-120, h/2);
            }
            if (won) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0,0,w,h);
                ctx.fillStyle = '#aaffff';
                ctx.font = '38px Arial';
                ctx.fillText('You reached the Veil', w/2-180, h/2 - 30);
                ctx.font = '22px Arial';
                ctx.fillText('Some things only move forward.', w/2-170, h/2 + 30);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
